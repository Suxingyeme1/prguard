name: Bug report
description: Report reproducible incorrect behavior
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private repository content, or hidden evaluator data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, task shape, outcome, and sanitized artifact references.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PRGuard version or commit
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Trust-boundary relevance
      description: Did this involve commands, paths, credentials, timeouts, or model context?
